name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compilar APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Renombrar APK y escribir versión
        run: |
          cp app/build/outputs/apk/release/app-release.apk Nioro-Launcher.apk
          echo "${{ github.run_number }}" > version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nioro-Launcher
          path: Nioro-Launcher.apk
      - name: Publicar release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nioro Launcher (última versión)
          files: |
            Nioro-Launcher.apk
            version.txt
          prerelease: false
