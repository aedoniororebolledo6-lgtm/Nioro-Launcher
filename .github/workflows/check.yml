name: Verificar rama

# Compila cada rama que no sea main, sin publicar nada.
# Así se sabe si un cambio compila ANTES de fusionarlo y de que llegue como actualización.
on:
  push:
    branches-ignore: [ main, master ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compilar (debug)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
